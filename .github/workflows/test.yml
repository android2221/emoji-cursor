name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test
        run: |
          xcodebuild test \
            -project EmojiCursor.xcodeproj \
            -scheme EmojiCursor \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO
